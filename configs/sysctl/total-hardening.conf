# /etc/sysctl.d/total-hardening.conf
#
# Kernel hardening drop-in. Documented in 02-Operating-System/sysctl-hardening.md
# Apply without rebooting:   sudo sysctl --system
# Check a value:             sysctl kernel.kptr_restrict
#
# NOTE: values in this file OVERRIDE the running kernel's defaults. If your kernel
# (e.g. linux-hardened) already ships a stricter default, do not lower it here.

# ---------------------------------------------------------------------------
# ACTIVE SETTINGS
# ---------------------------------------------------------------------------

# Hide kernel pointer addresses from users without CAP_SYSLOG (2 = hide from everyone)
kernel.kptr_restrict = 1

# Only privileged users may read the kernel ring buffer (dmesg)
kernel.dmesg_restrict = 1

# Yama: a process may only ptrace its own descendants
kernel.yama.ptrace_scope = 1

# Harden the BPF JIT compiler for all users (constant blinding, etc.)
net.core.bpf_jit_harden = 2

# ---------------------------------------------------------------------------
# REFERENCE ONLY - NOT APPLIED ON MY SYSTEM
# Commonly recommended settings kept here for future evaluation.
# Test each one before enabling; some can break software.
# ---------------------------------------------------------------------------

# kernel.kptr_restrict = 2                      # also hide pointers from root
# kernel.unprivileged_bpf_disabled = 1          # block unprivileged BPF programs
# kernel.kexec_load_disabled = 1                # prevent loading a new kernel at runtime
# kernel.perf_event_paranoid = 3                # restrict perf events (where supported)
# fs.protected_symlinks = 1                     # symlink/hardlink protections (often default)
# fs.protected_hardlinks = 1
# fs.protected_fifos = 2
# fs.protected_regular = 2
# fs.suid_dumpable = 0                          # no core dumps from setuid programs
# net.ipv4.conf.all.rp_filter = 1               # reverse-path filtering
# net.ipv4.conf.all.accept_redirects = 0        # ignore ICMP redirects
# net.ipv6.conf.all.accept_redirects = 0
# net.ipv4.conf.all.send_redirects = 0
# net.ipv4.tcp_syncookies = 1                   # SYN flood protection
